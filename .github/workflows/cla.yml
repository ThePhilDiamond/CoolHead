# Asks each new contributor to sign CLA.md once, on their first pull request, and
# records the signature in signatures/cla.json on the cla-signatures branch (main only takes changes through pull
# requests, so the action can't write there). Bots such as Dependabot don't sign.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/ThePhilDiamond/CoolHead/blob/main/CLA.md'
          branch: 'cla-signatures'
          # The action names a commit's author by their account, or, when the author has none (a bot such as
          # Dependabot isn't a user account), by the account that committed it: web-flow, GitHub's own committer for
          # commits made on its website and API. People with an account are always named by their own.
          allowlist: ThePhilDiamond,dependabot[bot],github-actions[bot],*[bot],web-flow
