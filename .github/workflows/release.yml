# On a version tag (v0.5.0), checks the version agrees everywhere, builds the app, signs it, and publishes the GitHub
# release "Cool Head 0.5.0" with its notes copied from CHANGELOG.md. The steps for a release are in RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag, VERSION, the app and CHANGELOG.md agree
        run: scripts/check-version.sh "$GITHUB_REF_NAME"
      - run: swift build -c release && .build/release/coolhead selftest
      - run: scripts/build-app.sh
      - name: Zip the app
        run: cd build && ditto -c -k --keepParent "Cool Head.app" "Cool-Head-${GITHUB_REF_NAME}.zip" && shasum -a 256 "Cool-Head-${GITHUB_REF_NAME}.zip" > SHA256SUMS.txt
      - name: Sign the update for the in-app updater
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set, so the in-app updater will refuse this release"
          else
            swift scripts/sign-update.swift "build/Cool-Head-${GITHUB_REF_NAME}.zip"
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v] " 'index($0, h) == 1 {on=1; next} /^## / || /^\[[^]]+\]: / {on=0} on' CHANGELOG.md > build/notes.md
          grep -q '^- ' build/notes.md || { echo "::error::CHANGELOG.md has no notes for $v"; exit 1; }
          echo "" >> build/notes.md
          echo "**Downloads:** \`Cool-Head-${GITHUB_REF_NAME}.zip\` is the app; \`.sig\` is its signature, which the in-app updater checks; \`SHA256SUMS.txt\` is its checksum. All changes: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." >> build/notes.md
          echo "TITLE=Cool Head $v" >> "$GITHUB_ENV"
          cat build/notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Cool-Head-${{ github.ref_name }}.zip
            build/Cool-Head-${{ github.ref_name }}.zip.sig
            build/SHA256SUMS.txt
          name: ${{ env.TITLE }}
          body_path: build/notes.md
