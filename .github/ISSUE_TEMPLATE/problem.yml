name: Report a problem
description: "Sent from Cool Head's \"Report a problem\": a fix caused trouble, or Cool Head is not working right. Posted under your GitHub account."
title: "Problem: "
labels: [problem]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Check everything below before submitting: you can edit or remove any of it."
  - type: textarea
    id: words
    attributes:
      label: What happened, in your words
      description: Leave out names, files and anything private; this is public.
  - type: textarea
    id: report
    attributes:
      label: Cool Head's recent activity
      description: Filled in by Cool Head. Processes are named only by kind (macOS's own and apps from Applications by name), with no paths, commands or file names.
    validations: { required: true }
