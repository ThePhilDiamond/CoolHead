name: A case Cool Head couldn't explain
description: Sent from Cool Head's "Share this case". It holds no file names, paths or project names; it is posted under your GitHub account.
title: "Case: "
labels: [case]
body:
  - type: markdown
    attributes:
      value: "Thanks for sharing. Cases like this one are how the catalogue learns. Check the report below before submitting; you can edit or remove anything."
  - type: textarea
    id: report
    attributes:
      label: What Cool Head saw
      description: Filled in by Cool Head. It holds the kind of process, how it behaved and the kind of Mac, and nothing about your files or work. It will be posted under your GitHub account.
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: Anything you know about it (optional)
      description: "For example: what you were doing at the time, or what the process turned out to be."
